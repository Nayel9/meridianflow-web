<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#1c1d1c"/>
  <defs>
    <linearGradient id="g" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <!-- halo arc -->
  <path d="M9 6 Q16 2 23 6" stroke="#a3e635" stroke-width="1" stroke-linecap="round" opacity="0.45" fill="none"/>
  <!-- left wing -->
  <path d="M2 16 L9 11 L9 16 Z"  fill="url(#g)" opacity="0.55"/>
  <path d="M2 16 L9 16 L9 21 Z"  fill="url(#g)" opacity="0.4"/>
  <path d="M5 13 L9 13 L9 19 Z"  fill="#a3e635" opacity="0.85"/>
  <!-- right wing -->
  <path d="M30 16 L23 11 L23 16 Z" fill="url(#g)" opacity="0.55"/>
  <path d="M30 16 L23 16 L23 21 Z" fill="url(#g)" opacity="0.4"/>
  <path d="M27 13 L23 13 L23 19 Z" fill="#a3e635" opacity="0.85"/>
  <!-- diamond eye -->
  <path d="M16 5 L24 16 L16 27 L8 16 Z"
        fill="#a3e635" fill-opacity="0.16"
        stroke="#a3e635" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- iris -->
  <path d="M16 11 L19 16 L16 21 L13 16 Z" fill="#a3e635"/>
  <!-- pupil -->
  <circle cx="16" cy="16" r="1.1" fill="#12181b"/>
</svg>
